{# EduSense reusable risk-band filter (additive). Include with {% include 'info/_risk_filter.html' %}. Server may ignore ?band=. #}
<div class="risk-filter-group" role="group" aria-label="Filter by risk band">
  <a class="risk-pill risk-all" data-band="all" href="?">All <span class="risk-count"></span></a>
  <a class="risk-pill risk-thriving" data-band="thriving" href="?band=thriving">Thriving <span class="risk-count"></span></a>
  <a class="risk-pill risk-steady" data-band="steady" href="?band=steady">Steady <span class="risk-count"></span></a>
  <a class="risk-pill risk-support" data-band="support" href="?band=support">Needs Support <span class="risk-count"></span></a>
  <a class="risk-pill risk-atrisk" data-band="at-risk" href="?band=at-risk">At-Risk <span class="risk-count"></span></a>
  <span class="risk-hint">Multi-select = ANY band (OR). Use .btn-navy for primary actions.</span>
</div>
