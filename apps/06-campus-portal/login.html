<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - EduSense</title>
<link rel="stylesheet" href="campus.css">
<style>
.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.logincard{background:#fff;border:1px solid #edf0f6;border-radius:20px;box-shadow:0 4px 24px rgba(16,24,40,.08);padding:30px;width:min(560px,94vw);text-align:center}
.logincard .logo{width:52px;height:52px;border-radius:14px;background:#2563eb;color:#fff;font-weight:700;font-size:22px;display:grid;place-items:center;margin:0 auto 10px}
.logincard h1{margin:0;font-size:22px}
.logincard p{color:#6b7280;font-size:13px;margin:6px 0 18px}
.rolepick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rolepick a{border:1.5px solid #e2e8f2;border-radius:16px;padding:18px 8px;text-decoration:none;color:#1f2937;font-weight:700}
.rolepick a i{display:block;font-style:normal;font-size:26px;margin-bottom:8px}
.rolepick a small{display:block;color:#6b7280;font-weight:400;font-size:11px;margin-top:4px}
.rolepick a:hover{border-color:#2563eb;background:#f4f8ff}
.field{text-align:left;margin:10px 0}
.field label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
.field input{width:100%;border:1px solid #e2e8f2;border-radius:10px;padding:10px 12px;font-size:14px;outline:none}
.field input:focus{border-color:#2563eb}
.err{display:none;background:#fee2e2;color:#b91c1c;border-radius:10px;font-size:12px;font-weight:600;padding:9px;margin:10px 0}
.bigbtn{width:100%;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:15px;font-weight:700;padding:12px;cursor:pointer;margin-top:12px}
.bigbtn:hover{background:#1d4ed8}
.backlink{display:inline-block;margin-top:14px;color:#2563eb;font-size:13px;font-weight:600;text-decoration:none}
.demonote{margin-top:14px;font-size:11px;color:#9aa3b5}
@media(max-width:560px){.rolepick{grid-template-columns:1fr}}
</style>
</head>
<body data-page="login">
<div class="loginwrap"><div class="logincard">
  <div class="logo">E</div>
  <h1>EduSense Login</h1>
  <p>Academic year 2026–27 · choose who you are to continue</p>
  <div class="rolepick">
    <a href="login-student.html"><i>🎒</i>Student<small>Mail ID · Roll No · Password</small></a>
    <a href="login-staff.html"><i>👩‍🏫</i>Staff<small>Mail ID · Password</small></a>
    <a href="login-hod.html"><i>👔</i>HOD<small>Name · Email ID · Password</small></a>
  </div>
  <p class="demonote">Static demo login — accounts verify against the office register once connected.</p>
</div></div>
</body>
</html>
